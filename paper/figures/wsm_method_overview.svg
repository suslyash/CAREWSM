<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
    <marker id="darrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
    <style>
      .title{font-family:Arial,sans-serif;font-size:19px;font-weight:700;fill:#172033}
      .sub{font-family:Arial,sans-serif;font-size:14px;font-weight:700;fill:#233044}
      .lab{font-family:Arial,sans-serif;font-size:12px;fill:#263449}
      .tiny{font-family:Arial,sans-serif;font-size:10px;fill:#42526a}
      .box{stroke:#52647c;stroke-width:1.25;rx:8;ry:8}
      .line{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#7c3aed;stroke-width:1.45;fill:none;stroke-dasharray:5,4;marker-end:url(#darrow)}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="28" y="31" class="title">WSM: availability-aware shared fusion and frozen training recipe</text>
  <text x="28" y="51" class="tiny">Solid arrows: inference. Dashed violet arrows: training-only supervision. Two independent sigmoid-logit outputs.</text>

  <rect x="25" y="75" width="1150" height="300" rx="12" fill="#f8fafc" stroke="#bac7d8"/>
  <text x="45" y="104" class="sub">(a) Primary equal-parameter shared fusion -- inference</text>

  <rect class="box" x="48" y="150" width="125" height="58" fill="#e0f2fe"/>
  <text x="110" y="174" text-anchor="middle" class="lab">WavLM audio</text><text x="110" y="191" text-anchor="middle" class="tiny">online feature</text>
  <rect class="box" x="48" y="253" width="125" height="58" fill="#dcfce7"/>
  <text x="110" y="277" text-anchor="middle" class="lab">DEPART-like CLIP</text><text x="110" y="294" text-anchor="middle" class="tiny">video + valid mask</text>

  <rect class="box" x="220" y="150" width="125" height="58" fill="#e8eef7"/>
  <text x="282" y="174" text-anchor="middle" class="lab">Audio projection</text><text x="282" y="191" text-anchor="middle" class="tiny">h_a = P_a(x_a)</text>
  <rect class="box" x="220" y="253" width="125" height="58" fill="#e8eef7"/>
  <text x="282" y="274" text-anchor="middle" class="lab">Masked pool +</text><text x="282" y="291" text-anchor="middle" class="lab">video projection</text>

  <rect class="box" x="400" y="111" width="155" height="52" fill="#fff7d6"/>
  <text x="477" y="133" text-anchor="middle" class="lab">Shared query</text><text x="477" y="150" text-anchor="middle" class="tiny">qbar = (qD + qP)/2</text>
  <rect class="box" x="400" y="188" width="155" height="58" fill="#fef3c7"/>
  <text x="477" y="211" text-anchor="middle" class="lab">Shared candidates</text><text x="477" y="228" text-anchor="middle" class="tiny">c_a, c_v from mean LN_t</text>

  <rect class="box" x="620" y="179" width="132" height="67" fill="#ede9fe"/>
  <text x="686" y="202" text-anchor="middle" class="lab">Availability-aware</text><text x="686" y="219" text-anchor="middle" class="lab">shared gate</text><text x="686" y="236" text-anchor="middle" class="tiny">masked softmax alpha</text>
  <rect class="box" x="810" y="179" width="135" height="67" fill="#fce7f3"/>
  <text x="877" y="202" text-anchor="middle" class="lab">Fused feature</text><text x="877" y="219" text-anchor="middle" class="tiny">u = qbar + alpha_a c_a</text><text x="877" y="234" text-anchor="middle" class="tiny">+ alpha_v c_v</text>
  <rect class="box" x="1000" y="147" width="125" height="54" fill="#fee2e2"/>
  <text x="1062" y="170" text-anchor="middle" class="lab">Depression head</text><text x="1062" y="187" text-anchor="middle" class="tiny">z_D</text>
  <rect class="box" x="1000" y="256" width="125" height="54" fill="#fee2e2"/>
  <text x="1062" y="279" text-anchor="middle" class="lab">Parkinson head</text><text x="1062" y="296" text-anchor="middle" class="tiny">z_P</text>

  <path class="line" d="M173 179 H220"/><path class="line" d="M173 282 H220"/>
  <path class="line" d="M345 179 H400"/><path class="line" d="M345 282 H400"/>
  <path class="line" d="M555 137 V200 H620"/><path class="line" d="M555 217 H620"/>
  <path class="line" d="M752 212 H810"/><path class="line" d="M945 202 H1000"/><path class="line" d="M945 223 H970 V283 H1000"/>
  <rect x="400" y="285" width="350" height="53" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="575" y="306" text-anchor="middle" class="tiny">Inset: full R4 keeps task-specific q_t, candidates, gates,</text>
  <text x="575" y="322" text-anchor="middle" class="tiny">and fused features; primary shares them. Both: 295,239 parameters.</text>

  <rect x="25" y="398" width="1150" height="330" rx="12" fill="#fcfbff" stroke="#c9bce6"/>
  <text x="45" y="428" class="sub">(b) Frozen training supervision -- TRAIN only</text>

  <rect class="box" x="50" y="480" width="145" height="62" fill="#dbeafe"/>
  <text x="122" y="503" text-anchor="middle" class="lab">Observed labels</text><text x="122" y="520" text-anchor="middle" class="tiny">mask m; truth wins</text>
  <rect class="box" x="50" y="595" width="145" height="71" fill="#f3e8ff"/>
  <text x="122" y="618" text-anchor="middle" class="lab">Immutable pseudo cache</text><text x="122" y="635" text-anchor="middle" class="tiny">accepted missing targets</text><text x="122" y="651" text-anchor="middle" class="tiny">detached reliability r</text>

  <rect class="box" x="280" y="463" width="145" height="52" fill="#e0f2fe"/>
  <text x="352" y="486" text-anchor="middle" class="lab">Audio auxiliary head</text><text x="352" y="503" text-anchor="middle" class="tiny">observed + available</text>
  <rect class="box" x="280" y="545" width="145" height="52" fill="#dcfce7"/>
  <text x="352" y="568" text-anchor="middle" class="lab">Video auxiliary head</text><text x="352" y="585" text-anchor="middle" class="tiny">observed + available</text>
  <rect class="box" x="280" y="627" width="145" height="43" fill="#fef3c7"/>
  <text x="352" y="652" text-anchor="middle" class="lab">Agreement: (sigmoid a - v)^2</text>

  <rect class="box" x="510" y="484" width="155" height="80" fill="#fce7f3"/>
  <text x="587" y="507" text-anchor="middle" class="lab">Per-task objectives</text><text x="587" y="524" text-anchor="middle" class="tiny">L_obs + lambda_p(e)L_pseudo</text><text x="587" y="541" text-anchor="middle" class="tiny">+ lambda_aux L_aux</text><text x="587" y="558" text-anchor="middle" class="tiny">+ lambda_agree L_agree</text>
  <rect class="box" x="740" y="484" width="170" height="80" fill="#ede9fe"/>
  <text x="825" y="507" text-anchor="middle" class="lab">RA-STCH scalarizer</text><text x="825" y="524" text-anchor="middle" class="tiny">detached controller weights</text><text x="825" y="541" text-anchor="middle" class="tiny">DEV progress; grad norm/cosine;</text><text x="825" y="558" text-anchor="middle" class="tiny">reliability EMA</text>
  <rect class="box" x="990" y="484" width="135" height="80" fill="#fee2e2"/>
  <text x="1057" y="509" text-anchor="middle" class="lab">Backpropagate</text><text x="1057" y="526" text-anchor="middle" class="lab">frozen recipe</text><text x="1057" y="546" text-anchor="middle" class="tiny">3 epochs observed-only;</text><text x="1057" y="560" text-anchor="middle" class="tiny">5-epoch pseudo ramp</text>

  <path class="dash" d="M195 511 H510"/><path class="dash" d="M195 631 H245 V524 H510"/>
  <path class="dash" d="M425 489 H510"/><path class="dash" d="M425 571 H510"/><path class="dash" d="M425 648 H510"/>
  <path class="dash" d="M665 524 H740"/><path class="dash" d="M910 524 H990"/>
  <text x="739" y="608" class="tiny" fill="#6d28d9">RA-STCH retained in frozen recipe; contribution not supported by ablation.</text>
  <text x="50" y="704" class="tiny">Accepted pseudo targets are calibrated frozen audio-teacher probabilities. Test has no pseudo supervision.</text>
</svg>
