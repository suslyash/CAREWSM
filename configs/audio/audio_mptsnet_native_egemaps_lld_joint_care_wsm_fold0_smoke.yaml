seed: 5
experiment_info:
  params:
    experiment_name: audio-mptsnet-native-egemaps_lld-joint-care-wsm-fold0-smoke
    run_name: smoke-seed5
data:
  name: carewsm_joint
  params:
    care_root: /media/maxim/Databases/CARE
    wsm_root: /media/maxim/Databases/WSM_NEW
    manifest: reports/feature_audit/sample_feature_availability.csv
    registry: /media/maxim/Databases/CARE/splits/features.json
    fold: 0
    feature_family: egemaps_lld
    batch_size: 8
    num_workers: 0
    shuffle_train: false
    max_train_samples: 8
    max_val_samples: 8
model:
  name: carewsm_mptsnet
  params:
    input_dim: 25
    hidden_dim: 16
    dropout: 0.1
loss:
  name: carewsm_masked_bce
optimizer:
  name: adamw_optimizer
  params:
    lr: 0.0001
    weight_decay: 0.0
train:
  params:
    epochs: 1
    device: cpu
    mixed_precision: false
    grad_clip_norm: 1.0
    log_every_steps: 1
    collect_cache: true
metrics:
  - name: carewsm_multitask_prf
callbacks:
  - name: checkpoint_callback
    params:
      log_path: logs/audio/mptsnet/native-egemaps_lld/joint-care-wsm-fold0
      filename_template: epoch={epoch}_{monitor}={value:.4f}.pt
      monitor: joint/average_macro_f1
      mode: max
      save_top_k: 1
      save_last: true
  - name: snapshot_callback
    params:
      log_path: logs/audio/mptsnet/native-egemaps_lld/joint-care-wsm-fold0
      include: [src, configs]
      save_code_zip: true
      save_config: true
  - name: carewsm_summary_callback
    params:
      filename: summary.csv
  - name: early_stopping_callback
    params:
      monitor: joint/average_macro_f1
      mode: max
      patience: 1
      min_delta: 0.0
logging:
  - name: console_file_logger
    params:
      log_path: logs/audio/mptsnet/native-egemaps_lld/joint-care-wsm-fold0
      log_file: train.log
      console_level: INFO
      file_level: WARNING
  - name: mlflow_logger
    params:
      tracking_uri: sqlite:///logs/mlflow.db
