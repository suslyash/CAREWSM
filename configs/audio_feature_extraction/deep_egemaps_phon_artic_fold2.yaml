callbacks:
- name: carewsm_feature_extraction_callback
  params:
    model_name: deep_egemaps_phon_artic
    fold: 2
    care_root: /media/maxim/Databases/CARE
    wsm_root: /media/maxim/Databases/WSM_NEW
    report_path: logs/audio_feature_extraction/deep_egemaps_phon_artic_fold2_report.json
data:
  name: carewsm_joint
  params:
    batch_size: 64
    care_root: /media/maxim/Databases/CARE
    feature_family:
    - emotionmsp_embeds
    - emotionmsp_trajectories
    - trillsson4_1
    - wav2vec_xlsr300m
    - egemaps_func
    - disvoice_phonation_static
    - disvoice_articulation_static
    cohort_feature_family:
    - emotionmsp_embeds
    - emotionmsp_trajectories
    - trillsson4_1
    - wav2vec_xlsr300m
    - egemaps_func
    - disvoice_phonation_static
    - disvoice_articulation_static
    independent_family_mean: true
    extraction_only: true
    fold: 2
    manifest: reports/feature_audit/sample_feature_availability.csv
    num_workers: 8
    pooling: mean
    registry: /media/maxim/Databases/CARE/splits/features.json
    shuffle_train: true
    wsm_root: /media/maxim/Databases/WSM_NEW
experiment_info:
  params:
    experiment_name: audio_interpretable_feature_fusion
    run_name: interp_BEPA_mean_gated64_equal_fold2
    include_time: false
loss:
  name: carewsm_stageg_mtl
  params:
    method: equal
    parkinson_pos_weight: 2.3653308480894686
metrics:
- name: carewsm_masked_multitask_classification
model:
  name: carewsm_static_gated_fusion
  params:
    input_dim: 3679
    hidden_dim: 64
    dropout: 0.1
    pack_extraction_features: true
    family_dims:
    - 1024
    - 3
    - 1024
    - 1024
    - 88
    - 28
    - 488
optimizer:
  name: adamw_optimizer
  params:
    lr: 0.0001
    weight_decay: 0.0
seed: 5
train:
  params:
    collect_cache: true
    device: cuda
    epochs: 50
    grad_clip_norm: 1.0
    log_every_steps: 100
    mixed_precision: true
