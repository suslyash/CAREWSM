callbacks:
- name: carewsm_validation_monitor
  params: {}
- name: checkpoint_callback
  params:
    filename_template: epoch={epoch}_{monitor}={value:.4f}.pt
    log_path: logs/fusion/sweep
    experiment_name: sweep
    run_name: bimodal_task_aware__A1_T10__fold0
    mode: max
    monitor: val_mean_corpora_tasks/macro_recall
    save_last: true
    save_top_k: 1
- name: early_stopping_callback
  params:
    min_delta: 0.0
    mode: max
    monitor: val_mean_corpora_tasks/macro_recall
    patience: 7
- name: carewsm_summary_callback
  params:
    filename: summary.txt
- name: snapshot_callback
  params:
    include:
    - src
    - configs
    log_path: logs/fusion/sweep
    experiment_name: sweep
    run_name: bimodal_task_aware__A1_T10__fold0
    save_code_zip: true
    save_config: true
data:
  name: carewsm_fusion
  params:
    care_root: /media/maxim/Databases/CARE
    wsm_root: /media/maxim/Databases/WSM_NEW
    manifest: reports/feature_audit/sample_feature_availability.csv
    fold: 0
    modalities:
    - audio
    - text
    audio_source: audio_id1
    video_source: video_4
    text_source: text_id10
    representation_key: shared_features
    batch_size: 32
    num_workers: 8
    shuffle_train: true
model:
  name: carewsm_bimodal_task_aware
  params:
    modalities:
    - audio
    - text
    dimensions:
      audio: 64
      text: 64
    hidden_dim: 64
    dropout: 0.1
loss:
  name: carewsm_masked_bce
metrics:
- name: carewsm_masked_multitask_classification
optimizer:
  name: adamw_optimizer
  params:
    lr: 0.0001
    weight_decay: 0.0
seed: 5
train:
  params:
    collect_cache: true
    device: cuda
    epochs: 50
    grad_clip_norm: 1.0
    log_every_steps: 100
    mixed_precision: true
experiment_info:
  params:
    experiment_name: sweep
    run_name: bimodal_task_aware__A1_T10__fold0
    include_time: false
logging:
- name: console_file_logger
  params:
    console_level: INFO
    file_level: INFO
    log_file: train.log
    log_path: logs/fusion/sweep
    experiment_name: sweep
    run_name: bimodal_task_aware__A1_T10__fold0
- name: mlflow_logger
  params:
    tracking_uri: sqlite:///logs/fusion/sweep/mlflow.db
    experiment_name: sweep
    run_name: bimodal_task_aware__A1_T10__fold0
