callbacks:
- name: carewsm_validation_monitor
  params: {}
- name: checkpoint_callback
  params:
    filename_template: epoch={epoch}_{monitor}={value:.4f}.pt
    log_path: logs/audio_interpretable_feature_fusion
    mode: max
    monitor: val_mean_corpora_tasks/macro_recall
    save_last: true
    save_top_k: 1
- name: early_stopping_callback
  params:
    min_delta: 0.0
    mode: max
    monitor: val_mean_corpora_tasks/macro_recall
    patience: 7
- name: carewsm_summary_callback
  params:
    filename: summary.txt
- name: carewsm_stageg_mtl_callback
  params: {}
- name: snapshot_callback
  params:
    include:
    - src
    - configs
    - scripts/audio_interpretable_feature_fusion
    log_path: logs/audio_interpretable_feature_fusion
    save_code_zip: true
    save_config: true
data:
  name: carewsm_joint
  params:
    batch_size: 64
    care_root: /media/maxim/Databases/CARE
    feature_family:
    - emotionmsp_embeds
    - emotionmsp_trajectories
    - trillsson4_1
    - wav2vec_xlsr300m
    - disvoice_phonation_static
    cohort_feature_family:
    - emotionmsp_embeds
    - emotionmsp_trajectories
    - trillsson4_1
    - wav2vec_xlsr300m
    - egemaps_func
    - disvoice_phonation_static
    - disvoice_articulation_static
    independent_family_mean: true
    fold: 3
    manifest: reports/feature_audit/sample_feature_availability.csv
    num_workers: 8
    pooling: mean
    registry: /media/maxim/Databases/CARE/splits/features.json
    shuffle_train: true
    wsm_root: /media/maxim/Databases/WSM_NEW
experiment_info:
  params:
    experiment_name: audio_interpretable_feature_fusion
    run_name: interp_BP_mean_gated64_equal_fold3
    include_time: false
logging:
- name: console_file_logger
  params:
    console_level: INFO
    file_level: INFO
    log_file: train.log
    log_path: logs/audio_interpretable_feature_fusion
- name: mlflow_logger
  params:
    tracking_uri: sqlite:///logs/audio_interpretable_feature_fusion/mlflow.db
loss:
  name: carewsm_stageg_mtl
  params:
    method: equal
    parkinson_pos_weight: 2.4134980988593155
metrics:
- name: carewsm_masked_multitask_classification
model:
  name: carewsm_static_gated_fusion
  params:
    input_dim: 3103
    hidden_dim: 64
    dropout: 0.1
    family_dims:
    - 1024
    - 3
    - 1024
    - 1024
    - 28
optimizer:
  name: adamw_optimizer
  params:
    lr: 0.0001
    weight_decay: 0.0
seed: 5
train:
  params:
    collect_cache: true
    device: cuda
    epochs: 50
    grad_clip_norm: 1.0
    log_every_steps: 100
    mixed_precision: true
