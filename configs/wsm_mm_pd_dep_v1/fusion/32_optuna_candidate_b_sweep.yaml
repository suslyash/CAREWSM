method: optuna
n_trials: 20
study_name: wsm-candidate-b-optuna-v1
target:
  monitor: dev/mean_score
  mode: max
parameters:
  model.params.hidden_dim:
    type: categorical
    choices: [96, 128, 160, 192, 224, 256]
  model.params.num_heads:
    type: categorical
    choices: [2, 4, 8]
  model.params.residual_hidden_dim:
    type: categorical
    choices: [64, 96, 128, 160, 192, 256]
  model.params.dropout:
    type: float
    low: 0.05
    high: 0.35
  optimizer.params.lr:
    type: float
    low: 0.00002
    high: 0.0004
    log: true
  optimizer.params.weight_decay:
    type: float
    low: 0.00001
    high: 0.05
    log: true
