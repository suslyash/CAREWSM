method: optuna
seed: 42

experiment_info:
  params:
    experiment_name: wsm_mm_pd_dep_v1
    run_name: postclosure_shared_progress_optuna_seed42

data:
  name: wsm_ramps_semantic_datamodule
  params:
    data_root: /media/maxim/Databases/WSM_NEW
    audio_feature_cache_root: /media/maxim/Databases/WSM_NEW/features
    video_cache_root: /media/maxim/Programs/Features/WSM/video_depart_v1_fullframe_fallback/cache
    pseudo_cache_path: /media/maxim/Programs/Features/WSM/ramps_r2_semantic_v1/train_missing_targets.pt
    batch_size: 32
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    shuffle_train: true
    drop_last_train: false

model:
  name: wsm_av_r3_disease_query_model
  params:
    audio_feature_dim: 768
    video_feature_dim: 512
    hidden_dim: 160
    gate_hidden_dim: 96
    dropout: 0.10034630487649018
    num_tasks: 2
    task_aware_fusion: false

loss:
  name: wsm_r4_ramps_balance_loss
  params:
    mode: progress
    pseudo_scale: 0.0
    aux_weight: 0.41215983081110485
    agreement_weight: 0.48126684525457264
    tau: 0.1
    progress_temperature: 0.7232081822527684
    progress_reference_depression: 0.697035
    progress_reference_parkinson: 0.852104
    controller_ema: 0.8
    grad_ema: 0.9
    reliability_ema: 0.9
    weight_min: 0.2
    weight_max: 0.8
    eps: 1.0e-8
optimizer:
  name: adamw_optimizer
  params:
    lr: 2.1217831107180076e-05
    weight_decay: 0.0001855295766514827

train:
  params:
    epochs: 30
    device: cuda
    mixed_precision: true
    grad_clip_norm: 0.5
    log_every_steps: 25
    collect_cache: true

metrics: []

callbacks:
  - name: wsm_segment_metrics_callback
    params:
      splits: [auto]
  - name: wsm_r4_balance_callback
    params: {}
  - name: checkpoint_callback
    params:
      log_path: logs
      filename_template: epoch={epoch}_{monitor}={value:.4f}.pt
      monitor: dev/mean_score
      mode: max
      save_top_k: 2
      save_last: true
  - name: snapshot_callback
    params:
      log_path: logs
      include:
        - src
        - configs
      save_code_zip: true
      save_config: true
  - name: early_stopping_callback
    params:
      monitor: dev/mean_score
      mode: max
      patience: 6
      min_delta: 0.0005
  - name: wsm_pseudo_scale_warmup_callback
    params:
      observed_only_epochs: 3
      ramp_epochs: 5
      final_scale: 1.0
  - name: wsm_summary_callback
    params:
      filename: summary.txt

logging:
  - name: console_file_logger
    params:
      log_path: logs
      log_file: train.log
      console_level: INFO
      file_level: INFO
  - name: mlflow_logger
    params:
      tracking_uri: sqlite:///logs/mlflow.db
n_trials: 30
study_name: postclosure-shared-progress-optuna-v1
target:
  monitor: dev/mean_score
  mode: max
parameters:
  model.params.hidden_dim:
    type: categorical
    choices: [128, 160, 192, 224, 256]
  model.params.gate_hidden_dim:
    type: categorical
    choices: [64, 96, 128, 160, 192, 256]
  model.params.dropout:
    type: float
    low: 0.05
    high: 0.35
  loss.params.aux_weight:
    type: float
    low: 0.05
    high: 0.50
  loss.params.agreement_weight:
    type: float
    low: 0.01
    high: 0.50
    log: true
  loss.params.progress_temperature:
    type: float
    low: 0.10
    high: 1.00
    log: true
  optimizer.params.lr:
    type: float
    low: 0.00002
    high: 0.0004
    log: true
  optimizer.params.weight_decay:
    type: float
    low: 0.00001
    high: 0.05
    log: true
