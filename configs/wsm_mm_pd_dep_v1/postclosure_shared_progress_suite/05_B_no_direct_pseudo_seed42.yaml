seed: 42
experiment_info:
  params:
    experiment_name: wsm_mm_pd_dep_v1
    run_name: task011b_no_direct_pseudo_seed42
data:
  name: wsm_ramps_semantic_dev_only_datamodule
  params:
    data_root: /media/maxim/Databases/WSM_NEW
    audio_feature_cache_root: /media/maxim/Databases/WSM_NEW/features
    video_cache_root: /media/maxim/Programs/Features/WSM/video_depart_v1_fullframe_fallback/cache
    pseudo_cache_path: /media/maxim/Programs/Features/WSM/ramps_r2_semantic_v1/train_missing_targets.pt
    batch_size: 32
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    shuffle_train: true
    drop_last_train: false
model:
  name: wsm_av_r3_disease_query_model
  params:
    audio_feature_dim: 768
    video_feature_dim: 512
    hidden_dim: 256
    gate_hidden_dim: 160
    dropout: 0.12075960927960282
    num_tasks: 2
    task_aware_fusion: false
loss:
  name: wsm_r4_ramps_balance_loss
  params:
    mode: progress
    pseudo_scale: 0.0
    aux_weight: 0.13766807917710405
    agreement_weight: 0.03459342001778893
    tau: 0.1
    progress_temperature: 0.30828928347915147
    progress_reference_depression: 0.697035
    progress_reference_parkinson: 0.852104
    controller_ema: 0.8
    grad_ema: 0.9
    reliability_ema: 0.9
    weight_min: 0.2
    weight_max: 0.8
    eps: 1.0e-08
optimizer:
  name: adamw_optimizer
  params:
    lr: 4.887296540836588e-05
    weight_decay: 0.0044116151533616825
train:
  params:
    epochs: 30
    device: cuda
    mixed_precision: true
    grad_clip_norm: 0.5
    log_every_steps: 25
    collect_cache: true
metrics: []
callbacks:
- name: wsm_segment_metrics_callback
  params:
    splits:
    - auto
- name: wsm_r4_balance_callback
  params: {}
- name: checkpoint_callback
  params:
    log_path: logs
    filename_template: epoch={epoch}_{monitor}={value:.4f}.pt
    monitor: dev/mean_score
    mode: max
    save_top_k: 2
    save_last: true
- name: snapshot_callback
  params:
    log_path: logs
    include:
    - src
    - configs
    save_code_zip: true
    save_config: true
- name: early_stopping_callback
  params:
    monitor: dev/mean_score
    mode: max
    patience: 6
    min_delta: 0.0005
- name: wsm_pseudo_scale_warmup_callback
  params:
    observed_only_epochs: 3
    ramp_epochs: 5
    final_scale: 0.0
- name: wsm_summary_callback
  params:
    filename: summary.txt
- name: sweep_target_callback
  params:
    monitor: dev/mean_score
    mode: max
logging:
- name: console_file_logger
  params:
    log_path: logs
    log_file: train.log
    console_level: INFO
    file_level: INFO
- name: mlflow_logger
  params:
    tracking_uri: sqlite:///logs/mlflow.db
